name: THS Market Pulse — обновление данных

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet pandas requests ta

      - name: Calculate Market Pulse
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: |
          if [ -f "scripts/calculate_market_pulse.py" ]; then
            sed -i 's|api.binance.com|data-api.binance.vision|g' scripts/calculate_market_pulse.py
            python scripts/calculate_market_pulse.py
          elif [ -f "calculate_market_pulse.py" ]; then
            sed -i 's|api.binance.com|data-api.binance.vision|g' calculate_market_pulse.py
            python calculate_market_pulse.py
          else
            sed -i 's|api.binance.com|data-api.binance.vision|g' .github/workflows/scripts/calculate_market_pulse.py
            python .github/workflows/scripts/calculate_market_pulse.py
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "THS Market Pulse Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: обновление Market Pulse [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
